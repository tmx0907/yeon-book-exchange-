<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Flip Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        h1 {
            color: #1a1a1a;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Main wrapper - uses original image dimensions */
        .animation-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
        }

        /* Each half wrapper */
        .half {
            width: 50%;
            height: 100%;
            position: relative;
            perspective: 1200px;
            overflow: hidden;
        }

        /* The flipping card - contains the ORIGINAL image */
        .flip-card {
            width: 200%;
            height: 100%;
            position: absolute;
            top: 0;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .flip-card.left {
            left: 0;
            transform-origin: right center;
            /* Show only left half of the image */
            clip-path: inset(0 50% 0 0);
        }

        .flip-card.right {
            left: -100%;
            transform-origin: left center;
            /* Show only right half of the image */
            clip-path: inset(0 0 0 50%);
        }

        .flip-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Animation */
        @keyframes flipCard {
            0% {
                transform: rotateY(0deg);
            }

            100% {
                transform: rotateY(360deg);
            }
        }

        .flip-card.animate {
            animation: flipCard 1.2s ease-in-out forwards;
        }

        /* Status indicator */
        .status {
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            font-weight: 500;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(0.9);
            }
        }

        .current-half {
            color: #1a1a1a;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Character Flip</h1>

        <div class="animation-wrapper">
            <!-- Left Half - uses ONLY the original image -->
            <div class="half">
                <div class="flip-card left" id="leftCard">
                    <img src="/Users/jungeunkim/.gemini/antigravity/brain/1bd980ba-0c26-4c1e-85f5-2acc56cef5ed/uploaded_image_0_1768564066922.png"
                        alt="Characters">
                </div>
            </div>

            <!-- Right Half - uses ONLY the original image -->
            <div class="half">
                <div class="flip-card right" id="rightCard">
                    <img src="/Users/jungeunkim/.gemini/antigravity/brain/1bd980ba-0c26-4c1e-85f5-2acc56cef5ed/uploaded_image_0_1768564066922.png"
                        alt="Characters">
                </div>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Flipping: <span class="current-half" id="currentHalf">LEFT</span>
        </div>
    </div>

    <script>
        const leftCard = document.getElementById('leftCard');
        const rightCard = document.getElementById('rightCard');
        const statusEl = document.getElementById('currentHalf');

        const pauseDuration = 800;

        function flipCard(card, label) {
            return new Promise(resolve => {
                statusEl.textContent = label;
                card.classList.add('animate');

                card.addEventListener('animationend', function handler() {
                    card.classList.remove('animate');
                    card.removeEventListener('animationend', handler);
                    resolve();
                });
            });
        }

        async function runSequence() {
            while (true) {
                // Flip left half
                await flipCard(leftCard, 'LEFT');

                // Pause
                await new Promise(r => setTimeout(r, pauseDuration));

                // Flip right half
                await flipCard(rightCard, 'RIGHT');

                // Pause before repeating
                await new Promise(r => setTimeout(r, pauseDuration));
            }
        }

        // Start the animation sequence
        setTimeout(runSequence, 800);
    </script>
</body>

</html>
